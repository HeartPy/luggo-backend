[mypy]
python_version = 3.12
plugins = mypy_django_plugin.main
strict = True
warn_return_any = True
disallow_untyped_defs = True
check_untyped_defs = True
warn_unused_configs = True
disallow_incomplete_defs = True
disallow_untyped_decorators = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = True
strict_equality = True

# ファイル除外設定
exclude =
    migrations/.*
    .*\.pyc
    __pycache__/.*
    .mypy_cache/.*
    venv/.*
    .venv/.*

[mypy.plugins.django-stubs]
; django_settings_module = ${DJANGO_SETTINGS_MODULE}
django_settings_module = project.settings

# Django関連の設定
[mypy-django.*]
ignore_missing_imports = True

# DRF関連の設定
[mypy-rest_framework.*]
ignore_missing_imports = True

[mypy-djangorestframework.*]
ignore_missing_imports = True

# その他の外部ライブラリ
[mypy-stripe.*]
ignore_missing_imports = True

[mypy-googlemaps.*]
ignore_missing_imports = True

[mypy-requests.*]
ignore_missing_imports = True

[mypy-PIL.*]
ignore_missing_imports = True

[mypy-decouple.*]
ignore_missing_imports = True

# アプリケーションの設定（厳密）
[mypy-users.*]
ignore_errors = False

[mypy-business_owners.*]
ignore_errors = False

[mypy-drivers.*]
ignore_errors = False

[mypy-administrators.*]
ignore_errors = False

[mypy-bookings.*]
ignore_errors = False

# ファイルごとの設定（緩和）
[mypy-*.urls]
disallow_untyped_defs = False
check_untyped_defs = False
warn_return_any = False
ignore_errors = False

[mypy-*.tests.*]
disallow_untyped_defs = False
check_untyped_defs = False
warn_return_any = False
ignore_errors = False

# 設定ファイルの設定（緩和）
[mypy-project.settings]
disallow_untyped_defs = False
check_untyped_defs = False
warn_return_any = False
ignore_errors = False

[mypy-project.prod_settings]
disallow_untyped_defs = False
check_untyped_defs = False
warn_return_any = False
ignore_errors = False