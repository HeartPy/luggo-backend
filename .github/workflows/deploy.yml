name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_migrate:
        description: "デプロイ後に migrate を実行する"
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-3
  ECR_REPOSITORY: luggo-backend
  ECS_CLUSTER: luggo

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: AWS に OIDC でログイン
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR にログイン
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: イメージを build / push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE_URI="${REGISTRY}/${ECR_REPOSITORY}"
          docker build \
            --platform linux/amd64 \
            -f Dockerfile.prod \
            -t "${IMAGE_URI}:${IMAGE_TAG}" \
            -t "${IMAGE_URI}:latest" \
            .
          docker push "${IMAGE_URI}:${IMAGE_TAG}"
          docker push "${IMAGE_URI}:latest"
          echo "Pushed ${IMAGE_URI}:${IMAGE_TAG} and :latest"

      - name: ECS サービスを再デプロイ
        env:
          SERVICE_API: ${{ vars.ECS_SERVICE_API || 'luggo-api' }}
          SERVICE_CELERY: ${{ vars.ECS_SERVICE_CELERY || 'luggo-api-celery-worker-service' }}
        run: |
          set -euo pipefail
          for SERVICE in "$SERVICE_API" "$SERVICE_CELERY"; do
            echo "Updating ${SERVICE}..."
            aws ecs update-service \
              --cluster "$ECS_CLUSTER" \
              --service "$SERVICE" \
              --force-new-deployment \
              --query 'service.serviceName' \
              --output text
          done

          echo "Waiting for services to stabilize..."
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$SERVICE_API" "$SERVICE_CELERY"
          echo "Services are stable."

      - name: migrate をワンショット実行
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.run_migrate)
        env:
          SUBNETS: ${{ vars.ECS_SUBNETS }}
          SECURITY_GROUP: ${{ vars.ECS_SECURITY_GROUP }}
          TASK_DEFINITION: ${{ vars.ECS_TASK_DEFINITION_API || 'luggo-api' }}
          CONTAINER: ${{ vars.ECS_CONTAINER_API || 'api' }}
        run: |
          set -euo pipefail
          if [ -z "${SUBNETS:-}" ] || [ -z "${SECURITY_GROUP:-}" ]; then
            echo "ECS_SUBNETS / ECS_SECURITY_GROUP が未設定のため migrate をスキップします。"
            echo "設定方法は docs/cd.md を参照してください。"
            exit 0
          fi

          SUBNET_CSV=$(printf '%s' "$SUBNETS" | tr -d ' ')
          OVERRIDES=$(jq -nc \
            --arg name "$CONTAINER" \
            '{containerOverrides:[{name:$name,command:["python","manage.py","migrate","--noinput"]}]}')

          TASK_ARN=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --launch-type FARGATE \
            --task-definition "$TASK_DEFINITION" \
            --network-configuration "awsvpcConfiguration={subnets=[${SUBNET_CSV}],securityGroups=[${SECURITY_GROUP}],assignPublicIp=ENABLED}" \
            --overrides "$OVERRIDES" \
            --query 'tasks[0].taskArn' \
            --output text)

          echo "migrate task: ${TASK_ARN}"
          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" \
            --tasks "$TASK_ARN" \
            --query "tasks[0].containers[?name=='${CONTAINER}'].exitCode | [0]" \
            --output text)

          echo "migrate exit code: ${EXIT_CODE}"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "migrate が失敗しました"
            exit 1
          fi
